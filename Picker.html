<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2d3f89;
      --primary-dark: #1d2a5d;
      --accent: #eaecf5;
      --text: #333;
      --text-light: #666;
      --white: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body { 
      font-family: 'Roboto', sans-serif; 
      padding: 0; 
      margin: 0; 
      color: var(--text);
      background-color: #f9fafb;
    }

    .container {
      padding: 24px;
    }

    h3 { 
      font-family: 'Lexend', sans-serif;
      color: var(--primary); 
      margin: 0 0 20px 0; 
      font-size: 1.25rem;
      font-weight: 600;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option { 
      position: relative;
      background: var(--white);
      padding: 16px; 
      border: 2px solid transparent; 
      border-radius: 10px; 
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option:hover { 
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      border-color: var(--accent);
    }

    .option.selected { 
      border-color: var(--primary);
      background-color: #f0f4ff;
    }

    .option input {
      display: none;
    }

    .radio-custom {
      width: 20px;
      height: 20px;
      border: 2px solid #d1d5db;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }

    .option.selected .radio-custom {
      border-color: var(--primary);
    }

    .option.selected .radio-custom::after {
      content: '';
      width: 10px;
      height: 10px;
      background: var(--primary);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .option-details {
      flex-grow: 1;
    }

    .option-date {
      font-weight: 600;
      font-size: 1rem;
      color: var(--primary);
      display: block;
    }

    .option-title {
      font-size: 0.875rem;
      color: var(--text-light);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .actions {
      display: flex;
      gap: 12px;
      position: sticky;
      bottom: 0;
      background: #f9fafb;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }

    .btn { 
      flex: 1;
      font-family: 'Lexend', sans-serif;
      background-color: var(--primary); 
      color: white; 
      padding: 12px 20px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover:not(:disabled) { background-color: var(--primary-dark); }
    .btn-cancel { background-color: #6b7280; }
    .btn-cancel:hover:not(:disabled) { background-color: #4b5563; }
    
    .btn:disabled { 
      background-color: #9ca3af; 
      cursor: not-allowed; 
    }

    /* Loading Overlay */
    #loader-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--accent);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-family: 'Lexend', sans-serif;
      font-weight: 600;
      color: var(--primary);
    }

    textarea { 
      width: 100%; 
      height: 180px; 
      margin: 12px 0; 
      font-family: 'Roboto Mono', monospace; 
      border: 1px solid #d1d5db; 
      border-radius: 8px;
      padding: 12px;
      font-size: 0.875rem;
      resize: none;
      background: #fff;
    }

    .success-msg {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="loader-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Generating Content...</div>
  </div>

  <div class="container" id="main-content">
    <h3><?= action.charAt(0).toUpperCase() + action.slice(1) ?> Newsletter</h3>
    
    <div class="options-grid">
      <? for (var i = 0; i < options.length; i++) { ?>
        <div class="option" onclick="selectOption(this, '<?= options[i].column ?>')">
          <div class="radio-custom"></div>
          <div class="option-details">
            <span class="option-date"><?= options[i].date ?></span>
            <div class="option-title"><?= options[i].title ?></div>
          </div>
          <input type="radio" name="column" value="<?= options[i].column ?>"> 
        </div>
      <? } ?>
    </div>

    <div class="actions">
      <button id="action-btn" class="btn" onclick="executeAction()"><?= action.charAt(0).toUpperCase() + action.slice(1) ?></button>
      <button id="cancel-btn" class="btn btn-cancel" onclick="google.script.host.close()">Cancel</button>
    </div>
  </div>

  <script>
    let selectedColumn = null;

    function selectOption(div, col) {
      selectedColumn = col;
      document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
      div.classList.add('selected');
      div.querySelector('input').checked = true;
    }

    function executeAction() {
      if (!selectedColumn) {
        alert('Please select a newsletter column.');
        return;
      }

      const overlay = document.getElementById('loader-overlay');
      const action = '<?= action ?>';
      
      overlay.style.display = 'flex';

      const successHandler = (result) => {
        overlay.style.display = 'none';
        if (action === 'generate') {
          showGeneratedHTML(result);
        } else if (action === 'preview') {
          const win = window.open();
          win.document.write(result);
          google.script.host.close();
        } else {
          google.script.host.close();
        }
      };

      const failureHandler = (err) => {
        overlay.style.display = 'none';
        alert('Error: ' + err.message);
      };

      if (action === 'send') {
        google.script.run.withSuccessHandler(successHandler).withFailureHandler(failureHandler).sendNewsletterFromColumn(selectedColumn);
      } else if (action === 'draft') {
        google.script.run.withSuccessHandler(successHandler).withFailureHandler(failureHandler).createDraftNewsletterFromColumn(selectedColumn);
      } else if (action === 'preview' || action === 'generate') {
        google.script.run.withSuccessHandler(successHandler).withFailureHandler(failureHandler).generateNewsletterHTMLFromColumn(selectedColumn);
      }
    }

    function showGeneratedHTML(html) {
      const content = document.getElementById('main-content');
      content.innerHTML = `
        <h3>Generated HTML Code</h3>
        <p style="font-size: 0.875rem; color: #666; margin-bottom: 8px;">Copy this code to use in other email tools.</p>
        <textarea id="html-output" readonly></textarea>
        <div class="actions">
          <button class="btn" onclick="copyHtml()" id="copy-btn">Copy to Clipboard</button>
          <button class="btn btn-cancel" onclick="google.script.host.close()">Close</button>
        </div>
      `;
      document.getElementById('html-output').value = html;
    }

    function copyHtml() {
      const output = document.getElementById('html-output');
      const btn = document.getElementById('copy-btn');
      output.select();
      document.execCommand('copy');
      
      const originalText = btn.innerText;
      btn.innerText = 'Copied!';
      btn.style.backgroundColor = '#10b981'; // Success green
      
      setTimeout(() => {
        btn.innerText = originalText;
        btn.style.backgroundColor = '';
      }, 2000);
    }
  </script>
</body>
</html>
